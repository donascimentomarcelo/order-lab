spring:
  application:
    name: pricing
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://127.0.0.1:5432/orderlab}
    username: ${PRICING_DB_USERNAME:system_design}
    password: ${PRICING_DB_PASSWORD:}
    hikari:
      pool-name: pricing-pool
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Serviço de preços do OrderLab
