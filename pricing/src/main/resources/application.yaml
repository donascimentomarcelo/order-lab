spring:
  application:
    name: pricing
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://127.0.0.1:5432/orderlab}
    username: ${PRICING_DB_USERNAME:system_design}
    password: ${PRICING_DB_PASSWORD:system_design}
    hikari:
      pool-name: pricing-pool
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

pricing:
  catalog:
    generated-product-seeding:
      enabled: ${PRICING_GENERATED_PRODUCT_SEEDING_ENABLED:true}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    env:
      enabled: true

logging:
  level:
    # org.springframework.jdbc.core: TRACE
    org.springframework.jdbc.core: DEBUG

info:
  app:
    name: ${spring.application.name}
    description: Serviço de preços do OrderLab
