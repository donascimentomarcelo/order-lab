global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pricing
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          environment: local

  - job_name: postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          environment: local
