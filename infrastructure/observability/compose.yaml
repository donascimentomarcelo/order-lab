name: order-lab-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: orderlab-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: orderlab-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: orderlab-postgres-exporter
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_URI:-host.docker.internal:5432/orderlab?sslmode=disable}
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-system_design}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-system_design}
    ports:
      - "9187:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    container_name: orderlab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-orderlab}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - postgres-exporter
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
