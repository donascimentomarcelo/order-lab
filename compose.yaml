name: order-lab

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderlab-postgres
    environment:
      POSTGRES_DB: ${PRICING_DB_NAME:-orderlab}
      POSTGRES_USER: ${PRICING_DB_USERNAME:-system_design}
      POSTGRES_PASSWORD: ${PRICING_DB_PASSWORD:-system_design}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
